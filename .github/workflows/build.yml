name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ["inferno_bin.py", "assets/**", "version_info.txt", "requirements.txt", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^APP_VERSION' inferno_bin.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build icon
        run: python inferno_bin.py --export-icon icon.ico
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name InfernoBin
          --icon icon.ico --version-file version_info.txt
          --add-data "assets;assets" inferno_bin.py

      - uses: actions/upload-artifact@v4
        with:
          name: InfernoBin
          path: dist/InfernoBin.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/InfernoBin.exe
          name: Inferno Bin v${{ steps.ver.outputs.version }}
          body: |
            ## 🔥 Inferno Bin v${{ steps.ver.outputs.version }}
            **حمّل `InfernoBin.exe` من الأسفل وشغّله مباشرة — لا يحتاج تثبيت ولا Python.**

            Download `InfernoBin.exe` below and run it — no installation, no Python required.

            > أول تشغيل قد يظهر تحذير Windows SmartScreen: اضغط **More info** ثم **Run anyway**.

            Designed & Developed by **Mohammed El-Shayeb (محمد الشايب)**
